<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    {% seo %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6efe4">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a id="skip-to-content" href="#content">Skip to the content.</a>

    <header class="site-shell" role="banner">
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.title | default: 'Thistle in the Sun' }} home">
          <span class="wordmark__glyph">T</span>
          <span>{{ site.title | default: "Thistle in the Sun" }}</span>
        </a>
        <div class="nav-links">
          <a href="{{ '/#work' | relative_url }}">Work</a>
          <a href="{{ '/#writing' | relative_url }}">Writing</a>
          <a href="{{ '/reading/' | relative_url }}">Reading</a>
          <a href="{{ '/#contact' | relative_url }}">Contact</a>
        </div>
      </nav>
    </header>

    <main id="content" class="main-content" role="main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <span>{{ site.title | default: "Thistle in the Sun" }}</span>
      <span class="site-footer__note">A quiet homepage, ready for real work and writing.</span>
    </footer>
  </body>
</html>
