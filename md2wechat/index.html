<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f6efe4" />
<title>Markdown 转公众号排版 · Distilling Cat</title>
<meta name="description" content="Markdown 一键转换为微信公众号可粘贴的富文本排版，支持主题切换、代码高亮、复制到剪贴板。" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-light.min.css" />
<style>
  :root {
    --paper: #f6efe4;
    --paper-deep: #eadfce;
    --ink: #26231f;
    --muted: #7f7467;
    --quiet: #b9ad9d;
    --line: rgba(38, 35, 31, 0.14);
    --sun: #c86f3b;
    --thistle: #524a75;
    --white: #fffaf2;
    --display: "Instrument Serif", "Newsreader", Georgia, serif;
    --serif: "Newsreader", Georgia, serif;
    --body: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --primary: var(--sun);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    width: 100%;
    min-width: 100%;
    font-family: var(--body);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    background:
      radial-gradient(circle at 78% 14%, rgba(200, 111, 59, 0.12), transparent 30rem),
      linear-gradient(90deg, rgba(38, 35, 31, 0.025) 1px, transparent 1px),
      linear-gradient(0deg, rgba(38, 35, 31, 0.018) 1px, transparent 1px),
      var(--paper);
    background-size: auto, 72px 72px, 72px 72px, auto;
  }
  body::before {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    content: "";
    background-image:
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.24) 1px, transparent 1px, transparent 4px);
    opacity: 0.34;
  }
  header {
    width: 100%;
    background: rgba(255, 250, 242, 0.6);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 14px clamp(24px, 5vw, 48px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-brand {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-brand .wordmark {
    font-family: var(--display);
    font-size: 1.2rem;
    color: var(--ink);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .header-brand .wordmark__glyph {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    background: var(--sun);
    color: var(--white);
    font-family: var(--display);
    font-size: 1rem;
    font-style: italic;
  }
  header h1 {
    font-size: 15px;
    margin: 0;
    font-weight: 500;
    color: var(--muted);
  }
  .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .toolbar label { font-size: 12px; color: var(--muted); }
  .toolbar select, .toolbar button {
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink);
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 13px;
    font-family: var(--body);
    cursor: pointer;
    transition: border-color 180ms ease;
  }
  .toolbar select:hover, .toolbar button:hover {
    border-color: var(--sun);
  }
  .toolbar button.primary {
    background: var(--sun);
    color: var(--white);
    border-color: var(--sun);
    font-weight: 500;
  }
  .toolbar button.primary:hover {
    filter: brightness(1.05);
  }

  main {
    width: 100%;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 20px clamp(24px, 5vw, 48px);
    min-height: 0;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .pane {
    background: rgba(255, 250, 242, 0.55);
    border: 1px solid var(--line);
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .pane h2 {
    margin: 0;
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 250, 242, 0.4);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  textarea#input {
    flex: 1;
    border: 0;
    outline: none;
    resize: none;
    padding: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    background: transparent;
  }
  #preview-wrap {
    flex: 1;
    overflow: auto;
    background: transparent;
  }
  #preview {
    padding: 20px;
    max-width: 760px;
    margin: 0 auto;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--white);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 13px;
    font-family: var(--body);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }

  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 12px clamp(24px, 5vw, 48px) 18px;
    border-top: 1px solid var(--line);
  }
  footer a { color: var(--thistle); text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <a class="wordmark" href="../">
      <span class="wordmark__glyph">T</span>
      <span>Distilling Cat</span>
    </a>
    <h1>Markdown 转公众号排版</h1>
  </div>
  <div class="toolbar">
    <label for="theme">主题</label>
    <select id="theme">
      <option value="default">默认蓝</option>
      <option value="elegant">优雅绿</option>
      <option value="warm">温暖橙</option>
      <option value="mono">极简灰</option>
    </select>
    <label for="font">字号</label>
    <select id="font">
      <option value="14px">14px</option>
      <option value="15px" selected>15px</option>
      <option value="16px">16px</option>
      <option value="17px">17px</option>
    </select>
    <button id="btn-sample">示例</button>
    <button id="btn-clear">清空</button>
    <button id="btn-copy" class="primary">复制到公众号</button>
  </div>
</header>

<main>
  <section class="pane">
    <h2>Markdown 输入</h2>
    <textarea id="input" spellcheck="false" placeholder="在这里粘贴你的 Markdown..."></textarea>
  </section>
  <section class="pane">
    <h2>
      <span>预览（公众号样式）</span>
      <span id="char-count" style="font-weight:400;"></span>
    </h2>
    <div id="preview-wrap">
      <div id="preview"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<footer>
  <span>Distilling Cat</span> · 纯前端实现，数据不上传 · <a href="../">返回首页</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/java.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/typescript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/go.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
