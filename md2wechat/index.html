<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#f6efe4" />
<title>Markdown 转公众号排版 · Distilling Cat</title>
<meta name="description" content="Markdown 一键转换为微信公众号可粘贴的富文本排版，支持主题切换、代码高亮、复制到剪贴板。" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-light.min.css" />
<style>
  :root {
    --paper: #f6efe4;
    --paper-deep: #eadfce;
    --ink: #26231f;
    --muted: #7f7467;
    --quiet: #b9ad9d;
    --line: rgba(38, 35, 31, 0.14);
    --sun: #c86f3b;
    --thistle: #524a75;
    --white: #fffaf2;
    --shadow: 0 30px 80px rgba(74, 54, 35, 0.08);
    --display: "Instrument Serif", "Newsreader", Georgia, serif;
    --serif: "Newsreader", Georgia, serif;
    --body: "Work Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --primary: var(--sun);
  }
  * { box-sizing: border-box; }
  html { margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    margin: 0;
    font-family: var(--body);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 78% 14%, rgba(200, 111, 59, 0.12), transparent 30rem),
      linear-gradient(90deg, rgba(38, 35, 31, 0.025) 1px, transparent 1px),
      linear-gradient(0deg, rgba(38, 35, 31, 0.018) 1px, transparent 1px),
      var(--paper);
    background-size: auto, 72px 72px, 72px 72px, auto;
  }
  body::before {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    content: "";
    background-image:
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.24) 1px, transparent 1px, transparent 4px);
    opacity: 0.34;
  }

  /* ── Header (matches site-shell + site-nav) ── */
  .site-shell {
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
    padding: 28px 0 0;
  }
  .site-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .wordmark {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-family: var(--serif);
    font-size: 1rem;
    font-weight: 400;
    text-decoration: none;
    color: var(--ink);
  }
  .wordmark__glyph {
    display: grid;
    width: 34px;
    height: 34px;
    place-items: center;
    color: var(--white);
    background: var(--ink);
    border-radius: 50%;
    font-family: var(--display);
    font-size: 1.28rem;
    line-height: 1;
  }
  .nav-links {
    display: inline-flex;
    align-items: center;
    gap: clamp(16px, 3vw, 36px);
  }
  .nav-links a {
    color: var(--muted);
    font-size: 0.78rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-decoration: none;
    text-transform: uppercase;
    transition: color 180ms ease;
  }
  .nav-links a:hover { color: var(--ink); }

  /* ── Page header ── */
  .page-header {
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
    padding: clamp(40px, 7vw, 72px) 0 clamp(24px, 4vw, 40px);
  }
  .page-header__kicker {
    margin: 0;
    color: var(--thistle);
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }
  .page-header__title {
    margin: 12px 0 0;
    font-family: var(--display);
    font-size: clamp(2.4rem, 5.5vw, 4.4rem);
    font-weight: 400;
    letter-spacing: -0.05em;
    line-height: 0.95;
  }
  .page-header__lede {
    max-width: 620px;
    margin: 20px 0 0;
    color: var(--muted);
    font-family: var(--serif);
    font-size: clamp(1rem, 2vw, 1.25rem);
    line-height: 1.55;
  }

  /* ── Toolbar ── */
  .toolbar-wrap {
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
    padding: 0 0 clamp(16px, 3vw, 24px);
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar-wrap label { font-size: 12px; color: var(--muted); }
  .toolbar-wrap select, .toolbar-wrap button {
    border: 1px solid var(--line);
    background: rgba(255, 250, 242, 0.6);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 12px;
    font-weight: 600;
    font-family: var(--body);
    letter-spacing: 0.04em;
    cursor: pointer;
    transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
  }
  .toolbar-wrap select:hover, .toolbar-wrap button:hover {
    border-color: var(--sun);
    transform: translateY(-1px);
  }
  .toolbar-wrap button.primary {
    background: var(--ink);
    color: var(--white);
    border-color: var(--ink);
  }
  .toolbar-wrap button.primary:hover {
    border-color: var(--sun);
    filter: none;
  }

  /* ── Main panes ── */
  main {
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    padding: 0 0 clamp(40px, 7vw, 72px);
    min-height: 0;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .pane {
    background: rgba(255, 250, 242, 0.55);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .pane h2 {
    margin: 0;
    padding: 12px 20px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    border-bottom: 1px solid var(--line);
    background: rgba(255, 250, 242, 0.4);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  textarea#input {
    flex: 1;
    border: 0;
    outline: none;
    resize: none;
    padding: 18px 20px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink);
    background: transparent;
  }
  #preview-wrap {
    flex: 1;
    overflow: auto;
    background: transparent;
  }
  #preview {
    padding: 22px;
    max-width: 760px;
    margin: 0 auto;
  }
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--white);
    padding: 10px 20px;
    border-radius: 999px;
    font-size: 13px;
    font-family: var(--body);
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }

  /* ── Footer (matches site-footer) ── */
  .site-footer {
    display: flex;
    width: min(1180px, calc(100% - 40px));
    margin: 0 auto;
    padding: 28px 0 42px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.82rem;
    justify-content: space-between;
    gap: 24px;
  }
  .site-footer__note { color: var(--quiet); }
  .site-footer a { color: var(--thistle); text-decoration: underline; text-underline-offset: 4px; }

  @media (max-width: 860px) {
    .site-footer { align-items: flex-start; flex-direction: column; }
  }
</style>
</head>
<body>

<header class="site-shell" role="banner">
  <nav class="site-nav" aria-label="Primary navigation">
    <a class="wordmark" href="../">
      <span class="wordmark__glyph">T</span>
      <span>Distilling Cat</span>
    </a>
    <div class="nav-links">
      <a href="../reading.html">Reading</a>
      <a href="../#tools">Tool</a>
    </div>
  </nav>
</header>

<div class="page-header">
  <p class="page-header__kicker">Tool</p>
  <h1 class="page-header__title">Markdown 转公众号排版</h1>
  <p class="page-header__lede">一键将 Markdown 转换为微信公众号可粘贴的富文本排版，支持主题切换、代码高亮、复制到剪贴板。</p>
</div>

<div class="toolbar-wrap">
  <label for="theme">主题</label>
  <select id="theme">
    <option value="default">默认蓝</option>
    <option value="elegant">优雅绿</option>
    <option value="warm">温暖橙</option>
    <option value="mono">极简灰</option>
  </select>
  <label for="font">字号</label>
  <select id="font">
    <option value="14px">14px</option>
    <option value="15px" selected>15px</option>
    <option value="16px">16px</option>
    <option value="17px">17px</option>
  </select>
  <button id="btn-sample">示例</button>
  <button id="btn-clear">清空</button>
  <button id="btn-copy" class="primary">复制到公众号</button>
</div>

<main>
  <section class="pane">
    <h2>Markdown 输入</h2>
    <textarea id="input" spellcheck="false" placeholder="在这里粘贴你的 Markdown..."></textarea>
  </section>
  <section class="pane">
    <h2>
      <span>预览（公众号样式）</span>
      <span id="char-count" style="font-weight:400;"></span>
    </h2>
    <div id="preview-wrap">
      <div id="preview"></div>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>

<footer class="site-footer">
  <span>Distilling Cat</span>
  <span class="site-footer__note">纯前端实现，数据不上传 · <a href="../">返回首页</a></span>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/javascript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/python.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/java.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/typescript.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/bash.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/json.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/xml.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/css.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/sql.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/lib/languages/go.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
